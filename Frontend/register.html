<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mentor Mentee System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #2c3e50, #3498db);
    padding: 1rem;
}

.register-box {
    background: #fff;
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 420px;
}

h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    color: #2c3e50;
}

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.3rem;
    font-weight: 500;
    color: #555;
    font-size: 0.9rem;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 0.65rem 1rem;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 0.95rem;
    background: #fff;
    transition: border 0.2s;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #3498db;
}

.email-hint {
    font-size: 0.78rem;
    color: #888;
    margin-top: 0.3rem;
}

.btn-register {
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(135deg, #1abc9c, #3498db);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    margin-top: 0.5rem;
    transition: all 0.2s ease;
}

.btn-register:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

#result {
    text-align: center;
    margin-top: 0.75rem;
    font-size: 0.9rem;
    padding: 0.5rem;
    border-radius: 6px;
    display: none;
}

#result.error {
    background: #fdecea;
    color: #e74c3c;
}

#result.success {
    background: #eafaf1;
    color: #27ae60;
}

.link {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #666;
}

.link a {
    color: #3498db;
    text-decoration: none;
}

.link a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
<div class="register-box">
    <h2><i class="fas fa-user-plus" style="color:#3498db;"></i><br>Create Account</h2>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="e.g. yourname@gmail.com" required>
        <div class="email-hint"><i class="fas fa-info-circle"></i> Accepted: Gmail, Yahoo, Outlook, Hotmail, iCloud</div>
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
    </div>
    <div class="form-group">
        <label>Department</label>
        <select id="dep" required>
            <option value="">Select Department</option>
            <option value="mca">MCA</option>
            <option value="civil">Civil</option>
            <option value="mechanical">Mechanical</option>
            <option value="computer">Computer</option>
            <option value="aids">AIDS</option>
            <option value="me">ME</option>
        </select>
    </div>
    <div class="form-group">
        <label>Role</label>
        <select id="role" required>
            <option value="">Select Role</option>
            <option value="mentor">Mentor</option>
            <option value="mentee">Mentee</option>
            <option value="admin">Admin</option>
        </select>
    </div>

    <button class="btn-register" onclick="doRegister()"><i class="fas fa-user-plus"></i> Register</button>
    <div id="result"></div>
    <p class="link">Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
const API = "http://127.0.0.1:8000";
const ALLOWED_DOMAINS = ["gmail.com","yahoo.com","outlook.com","hotmail.com","icloud.com"];

function showResult(text, type) {
    const el = document.getElementById("result");
    el.textContent = text;
    el.className = type;
    el.style.display = "block";
}

async function doRegister() {
    const name  = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass  = document.getElementById("password").value.trim();
    const dep   = document.getElementById("dep").value;
    const role  = document.getElementById("role").value;

    if (!name || !email || !pass || !dep || !role) {
        showResult("Please fill in all fields", "error"); return;
    }
    // Client-side domain check (server also validates)
    const domain = email.split("@")[1] || "";
    if (!ALLOWED_DOMAINS.includes(domain)) {
        showResult(`Email domain '@${domain}' is not allowed. Please use Gmail, Yahoo, Outlook, Hotmail, or iCloud.`, "error");
        return;
    }

    try {
        const res  = await fetch(`${API}/register`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({name, email, password: pass, dep, role})
        });
        const data = await res.json();
        if (data.success) {
            showResult("Registered successfully! Redirecting to login...", "success");
            setTimeout(() => window.location.href = "login.html", 1500);
        } else {
            showResult(data.message || "Registration failed", "error");
        }
    } catch (e) {
        showResult("Server error. Is the backend running?", "error");
    }
}

document.addEventListener("keydown", e => { if (e.key === "Enter") doRegister(); });
</script>
</body>
</html>
